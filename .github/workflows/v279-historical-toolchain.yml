name: V279 historical 2025 toolchain root audit
on:
  pull_request:
    paths: ["scripts/v279_historical_toolchain.py",".github/workflows/v279-historical-toolchain.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip "fafbseg==3.2.0" "navis==1.10.0" "pandas>=2.0" "numpy>=1.24" "jax>=0.4.0" "jaxlib>=0.4.0"
      - run: python scripts/v279_historical_toolchain.py
      - uses: actions/upload-artifact@v4
        with: {name: V279-historical-toolchain, path: v279_results/}
