name: V258 published subtree dendrite evidence

on:
  push:
    branches:
      - v258-published-subtree-dendrite-evidence
  pull_request:
    branches:
      - main
      - v258-published-subtree-dendrite-evidence
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest

      - name: Unit and project regression tests
        run: python -m pytest -q scripts/test_v258_published_subtree_dendrite_evidence.py

      - name: Regenerate V258 evidence
        run: |
          rm -rf /tmp/v258_results
          python scripts/v258_published_subtree_dendrite_evidence.py \
            --v230 v230_results/V230_target_synapses.csv \
            --morphology-dir v229_results \
            --output-dir /tmp/v258_results

      - name: Sync generated evidence into repository
        if: github.event_name != 'pull_request'
        run: |
          rm -rf v258_results
          cp -R /tmp/v258_results v258_results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v258_results/
          if git diff --cached --quiet; then
            echo "Generated evidence is already current."
          else
            git commit -m "Add V258 generated evidence"
            git push origin HEAD:v258-published-subtree-dendrite-evidence
          fi

      - name: Verify checked-in evidence matches regeneration
        run: |
          cmp v258_results/V258_published_subtree_dendrite_mapping.csv \
            /tmp/v258_results/V258_published_subtree_dendrite_mapping.csv
          cmp v258_results/V258_published_subtree_dendrite_mapping.json \
            /tmp/v258_results/V258_published_subtree_dendrite_mapping.json

      - name: Print report
        run: cat /tmp/v258_results/V258_published_subtree_dendrite_mapping.json

      - name: Upload V258 evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: V258-published-subtree-dendrite-evidence
          path: /tmp/v258_results/
          retention-days: 90
