name: Research Integrity Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-integrity-gate:
    name: research-integrity-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pandas pytest "jax>=0.4.0" "jaxlib>=0.4.0"

      - name: Compile repository scripts
        run: python -m compileall -q scripts

      - name: Run core evidence tests
        run: |
          python -m pytest -q             scripts/test_v255_finalize_usable_circuit_evidence_pack.py             scripts/test_v256_compartment_evidence_audit.py             scripts/test_v257_published_dendrite_provenance.py             scripts/test_v258_published_subtree_dendrite_evidence.py             scripts/test_v259_published_point_provenance.py

      - name: Verify repository evidence invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, json

          roots = {
              "T4a": "720575940632008007",
              "T4c": "720575940616224414",
              "T5a": "720575940625571465",
              "T5c": "720575940617782941",
          }

          v230 = Path("v230_results/V230_target_synapses.csv")
          assert v230.exists(), "missing V230 target artifact"
          with v230.open(encoding="utf-8") as fh:
              rows = list(csv.DictReader(fh))
          assert len(rows) == 649, f"V230 row regression failed: {len(rows)}"

          v258 = Path("v258_results/V258_published_subtree_dendrite_mapping.json")
          assert v258.exists(), "missing V258 mapping report"
          report = json.loads(v258.read_text(encoding="utf-8"))
          assert report["counts"]["mapping_rows"] == 649

          if Path("v261_results/V261_coordinate_provenance_audit.json").exists():
              v261 = json.loads(Path("v261_results/V261_coordinate_provenance_audit.json").read_text())
              assert v261["status"] == "PASS_PUBLISHED_PROVENANCE_WITH_FRAME_SEPARATION"
              assert v261["scientific_boundary"]["published_to_v229_coordinate_identity"] == "UNRESOLVED"

          assert len(roots) == 4
          print("research evidence invariants: PASS")
          PY
