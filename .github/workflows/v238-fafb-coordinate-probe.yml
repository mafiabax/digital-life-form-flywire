name: V238 FAFB v783 coordinate provenance probe
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/v238_fafb_coordinate_probe.py"
      - "scripts/test_v238_fafb_coordinate_probe.py"
      - "v230_results/V230_target_synapses.csv"
      - ".github/workflows/v238-fafb-coordinate-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit test
        run: python scripts/test_v238_fafb_coordinate_probe.py
      - name: Probe canonical FAFB v783
        run: python scripts/v238_fafb_coordinate_probe.py
      - name: Upload probe evidence
        uses: actions/upload-artifact@v7
        with:
          name: v238-fafb-coordinate-probe
          path: v238_results/V238_coordinate_probe.json
          retention-days: 90
