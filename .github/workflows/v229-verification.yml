name: V229 verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile v229_recovery_runner.py scripts/v230_zenodo_exact_probe.py scripts/v230_proofread_pair_probe.py scripts/v231_circuit_fingerprint.py scripts/build_evidence_ledger.py scripts/run_v231_audit.py scripts/v231_evidence_engine.py scripts/build_v231_target_capsule.py scripts/v233_evidence_task_graph.py scripts/test_v234_checkpoint_binding.py
      - name: Unit tests
        run: python test_v229_recovery_runner.py
      - name: V231 structural fingerprint test
        run: python test_v231_circuit_fingerprint.py
      - name: Evidence ledger test
        run: python test_evidence_ledger.py
      - name: Evidence engine test
        run: python test_v231_evidence_engine.py
      - name: Target capsule test
        run: python scripts/test_v231_target_capsule.py
      - name: Persistent worker test
        run: python scripts/test_v232_persistent_worker.py
      - name: V233 task graph test
        run: python scripts/test_v233_evidence_task_graph.py
      - name: V234 checkpoint binding test
        run: python scripts/test_v234_checkpoint_binding.py
      - name: Compile persistent worker
        run: python -m py_compile scripts/v232_persistent_worker.py
      - name: End-to-end local audit test
        run: python test_v231_audit.py
      - name: V230 artifact validation
        run: python test_v230_target_synapses.py
      - name: Dependency imports
        run: |
          python -m pip install -r requirements.txt
          python -c "import fafbseg, navis, pyarrow; print('PASS: runtime dependencies import')"

  network-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Network probe
        run: python scripts/network_probe.py --strict
