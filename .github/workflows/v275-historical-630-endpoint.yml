name: V275 direct historical flywire_skeletons_630 audit
on:
  pull_request:
    paths:
      - "scripts/v275_historical_630_endpoint.py"
      - ".github/workflows/v275-historical-630-endpoint.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip "pandas>=2.0" "numpy>=1.24" "jax>=0.4.0" "jaxlib>=0.4.0"
      - run: python scripts/v275_historical_630_endpoint.py
      - uses: actions/upload-artifact@v4
        with:
          name: V275-historical-630-endpoint
          path: v275_results/
