name: V274 production mesh PP3 historical frame audit
on:
  pull_request:
    paths:
      - "scripts/v274_production_mesh_pp3.py"
      - ".github/workflows/v274-production-mesh-pp3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip "fafbseg==3.2.2" "navis==1.12.0" "jax>=0.4.0" "jaxlib>=0.4.0"
      - run: python scripts/v274_production_mesh_pp3.py
      - uses: actions/upload-artifact@v4
        with:
          name: V274-production-mesh-pp3
          path: v274_results/
