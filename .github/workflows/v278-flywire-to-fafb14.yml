name: V278 FLYWIRE to FAFB14 frame audit
on:
  pull_request:
    paths: ["scripts/v278_flywire_to_fafb14.py",".github/workflows/v278-flywire-to-fafb14.yml"]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip "navis==1.12.0" flybrains numpy
      - run: python scripts/v278_flywire_to_fafb14.py
      - uses: actions/upload-artifact@v4
        with: {name: V278-flywire-to-fafb14, path: v278_results/}
