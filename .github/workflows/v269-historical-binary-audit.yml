name: V269 historical binary data schema and root linkage

on:
  pull_request:
    paths:
      - "scripts/v269_historical_data_schema.py"
      - ".github/workflows/v269-historical-binary-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip "pandas>=2.0" "numpy>=1.24" "jax>=0.4.0" "jaxlib>=0.4.0"

      - name: Run historical binary audit
        run: python scripts/v269_historical_data_schema.py

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: V269-historical-binary-data-audit
          path: v269_results/
