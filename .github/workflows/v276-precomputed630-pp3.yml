name: V276 exact precomputed FAFB 630 skeleton audit
on:
  pull_request:
    paths:
      - "scripts/v276_precomputed630_pp3.py"
      - ".github/workflows/v276-precomputed630-pp3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip "fafbseg==3.2.2" "navis==1.12.0" "pandas>=2.0" "numpy>=1.24" "jax>=0.4.0" "jaxlib>=0.4.0"
      - run: python scripts/v276_precomputed630_pp3.py
      - uses: actions/upload-artifact@v4
        with:
          name: V276-precomputed630-pp3
          path: v276_results/
