name: V264 Point_data Anchor Extraction

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install historical pickle dependencies
        run: python -m pip install --disable-pip-version-check pandas "jax>=0.4.0" "jaxlib>=0.4.0"

      - name: Recover exact historical Point_data blob
        env:
          STUDY_REPO: borstlab/T4_T5_Dendrite_Morphology_Paper
          STUDY_COMMIT: 56901ad1853b44aeca15504cd908fa4c31009a3e
          EXPECTED_POINT_BLOB: b85caf49f45677f2075f7b5f2c8830141cd96d02
          EXPECTED_POINT_SHA256: 76b7d6a1c44ad6b2ca730feff88174c71327e095cce45d8a47a0d998f77df58f
        run: |
          git fetch --no-tags --depth=1 https://github.com/$STUDY_REPO.git $STUDY_COMMIT
          git -C . show "$STUDY_COMMIT:Data/Point_data.pkl" > /tmp/Point_data.pkl
          test -s /tmp/Point_data.pkl

          ACTUAL_BLOB="$(git hash-object -t blob /tmp/Point_data.pkl)"
          ACTUAL_SHA256="$(sha256sum /tmp/Point_data.pkl | cut -d ' ' -f 1)"
          ACTUAL_SIZE="$(stat -c '%s' /tmp/Point_data.pkl)"

          printf '%s\n' \
            "Point_data size=$ACTUAL_SIZE" \
            "Point_data git-blob=$ACTUAL_BLOB" \
            "Point_data sha256=$ACTUAL_SHA256" \
            "Expected historical git-blob=$EXPECTED_POINT_BLOB" \
            "Expected historical sha256=$EXPECTED_POINT_SHA256" \
            > /tmp/point_data_hash_report.txt

          test "$ACTUAL_BLOB" = "$EXPECTED_POINT_BLOB"
          test "$ACTUAL_SHA256" = "$EXPECTED_POINT_SHA256"

      - name: Extract four anchors
        run: python scripts/v264_point_data_anchor_extract.py

      - name: Upload Point_data bytes and hash evidence
        uses: actions/upload-artifact@v4
        with:
          name: V264-Point-data-raw-and-hash
          path: |
            /tmp/Point_data.pkl
            /tmp/point_data_hash_report.txt

      - uses: actions/upload-artifact@v4
        with:
          name: V264-Point-data-anchor-rows
          path: v264_results/V264_Point_data_anchor_rows.json
