name: V239 canonical FAFB pair probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v239-canonical-pair-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install "pyarrow>=18,<24"
      - name: Download canonical v783 pair table
        run: |
          curl -L --fail --retry 5 "https://zenodo.org/records/10676866/files/proofread_connections_783.feather?download=1" -o /tmp/proofread_connections_783.feather
          md5sum /tmp/proofread_connections_783.feather
      - name: Run probe tests
        run: python scripts/test_v239_canonical_pair_probe.py
      - name: Compare V230 pairs
        run: |
          python scripts/v239_canonical_pair_probe.py --source /tmp/proofread_connections_783.feather --target-csv v230_results/V230_target_synapses.csv --output /tmp/V239_pair_probe.json
      - name: Publish evidence
        uses: actions/upload-artifact@v7
        with:
          name: V239-canonical-pair-probe
          path: /tmp/V239_pair_probe.json
          retention-days: 90
