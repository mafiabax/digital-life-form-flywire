name: V273 direct fafbseg flat 783 mesh coordinate audit

on:
  pull_request:
    paths:
      - "scripts/v273_fafbseg_public_mesh_audit.py"
      - ".github/workflows/v273-fafbseg-public-mesh-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install historical toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.0" "numpy>=1.24" "jax>=0.4.0" "jaxlib>=0.4.0" "navis==1.10.0" "fafbseg==3.0.10" "skeletor>=1.2.2"
      - name: Audit direct FlyWire public meshes
        run: python scripts/v273_fafbseg_public_mesh_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: V273-fafbseg-flat-783-mesh-audit
          path: v273_results/
