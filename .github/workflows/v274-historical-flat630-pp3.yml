name: V274 historical flat 630 PP3 audit
on:
  pull_request:
    paths:
      - "scripts/v274_historical_flat630_pp3.py"
      - ".github/workflows/v274-historical-flat630-pp3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --upgrade pip "fafbseg==3.2.2" "navis==1.12.0" "jax>=0.4.0" "jaxlib>=0.4.0"
      - run: python scripts/v274_historical_flat630_pp3.py
      - uses: actions/upload-artifact@v4
        with:
          name: V274-historical-flat630-pp3
          path: v271_results/
