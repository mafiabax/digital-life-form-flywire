name: V236 live service evidence integrity

on:
  workflow_dispatch:
  push:
    branches:
      - v236-live-service-evidence
      - main
    paths:
      - "v236_results/V236_live_service_evidence.json"
      - "scripts/test_v236_live_service_evidence.py"
      - ".github/workflows/v236-live-service-evidence.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/test_v236_live_service_evidence.py
